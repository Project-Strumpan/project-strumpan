services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - /opt/strumpan/.env
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/strumpan/nginx/strumpan.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/strumpan/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
